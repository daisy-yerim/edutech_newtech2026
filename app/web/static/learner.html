<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습자 문제 풀이</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<header class="topbar"><div class="brand">Korean Assessment Lab</div><nav class="nav"><a href="/teacher">교수자</a><a class="active" href="/learner">학습자</a></nav></header>
<main class="page"><section class="hero"><h1>학습자 문제 풀이</h1><p class="muted">교수자가 승인해 게시한 문제만 표시됩니다.</p></section>
<section class="card"><div class="grid3"><div><label>등급</label><select id="grade"></select></div><div><label>교수자</label><select id="teacher" disabled><option>등급을 선택하세요</option></select></div><div><label>문제</label><select id="task" disabled><option>교수자를 선택하세요</option></select></div></div></section>
<section id="empty" class="status info">등급과 교수자를 선택해 주세요.</section>
<form id="solveForm" class="hidden"><section class="card"><h2>읽기 지문</h2><div id="meta" class="status info"></div><div id="passage" class="passage"></div></section><section class="card"><h2>읽기 문제</h2><div id="reading"></div></section><section class="card"><h2 id="writingTitle">쓰기 문제</h2><div id="writingInstruction"></div><label>쓰기 답안</label><textarea id="writingAnswer" placeholder="답안을 작성하세요."></textarea><div class="button-row"><button class="primary" type="submit">제출하고 채점하기</button></div></section></form>
<section id="working" class="card hidden"><div class="spinner"></div><h2 style="text-align:center">채점 중입니다</h2><p class="muted" style="text-align:center">읽기는 승인 정답과 비교하고, 쓰기는 내용·과제 수행 30, 전개 구조 30, 언어 사용 40 기준으로 평가합니다.</p></section>
<section id="result" class="hidden"><div class="card"><h2>읽기 결과</h2><div id="readingScore" class="score"></div><div id="readingResult"></div></div><div class="card"><h2>쓰기 결과</h2><div id="writingScore" class="score"></div><div id="writingResult"></div></div></section><div id="error" class="status error hidden"></div></main><script type="module" src="/static/learner.js"></script></body></html>
